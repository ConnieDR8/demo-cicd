# LAB04 R2: GitLab CI equivalent to the GitHub Actions pipeline.
# Requires GitLab.com Linux runners with Docker-in-Docker support.
# The deploy job validates the release in an ephemeral environment; GitHub
# Actions remains responsible for persistent STAGING on Rancher Desktop.

stages:
  - test
  - build
  - deploy

include:
  - template: Jobs/SAST.gitlab-ci.yml

.sast-analyzer:
  allow_failure: false

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

lint:
  stage: test
  image: node:22-alpine
  script:
    - npm ci
    - npm run lint

test_unit_and_site:
  stage: test
  image: node:22-alpine
  script:
    - npm ci
    - npm ci --prefix api
    - npm run test:unit
    - npm run test:site

test_integration:
  stage: test
  image: docker:27.5.1-cli
  services:
    - name: docker:27.5.1-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
    DOCKER_DRIVER: overlay2
    APP_URL: http://docker:8080
  before_script:
    - apk add --no-cache nodejs npm docker-cli-compose openssl
  script:
    - npm ci
    - echo "DB_PASSWORD=$(openssl rand -hex 12)" > .env
    - echo "GRAFANA_PASSWORD=$(openssl rand -hex 24)" >> .env
    - docker compose up -d --build --wait
    - npm run test:integration
  after_script:
    - docker compose logs --no-color || true
    - docker compose down -v --remove-orphans || true

build_images:
  stage: build
  image: docker:27.5.1-cli
  services:
    - name: docker:27.5.1-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
    DOCKER_DRIVER: overlay2
  parallel:
    matrix:
      - SERVICE: [web, api, db]
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - docker build --pull -t "$CI_REGISTRY_IMAGE/$SERVICE:$CI_COMMIT_SHORT_SHA" "./$SERVICE"
    - docker push "$CI_REGISTRY_IMAGE/$SERVICE:$CI_COMMIT_SHORT_SHA"

deploy_validation:
  stage: deploy
  image: docker:27.5.1-cli
  services:
    - name: docker:27.5.1-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
    DOCKER_DRIVER: overlay2
  environment:
    name: r2-validation-ephemeral
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
  before_script:
    - apk add --no-cache bash curl openssl
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - |
      set -eu
      DB_PASSWORD="$(openssl rand -hex 16)"
      trap 'docker rm -f r2-web r2-api r2-db >/dev/null 2>&1 || true; docker network rm r2-net >/dev/null 2>&1 || true' EXIT
      docker network create r2-net
      for service in web api db; do
        docker pull "$CI_REGISTRY_IMAGE/$service:$CI_COMMIT_SHORT_SHA"
      done
      docker run -d --rm --name r2-db --network r2-net \
        -e POSTGRES_DB=libro -e POSTGRES_USER=app \
        -e "POSTGRES_PASSWORD=$DB_PASSWORD" \
        "$CI_REGISTRY_IMAGE/db:$CI_COMMIT_SHORT_SHA"
      docker run -d --rm --name r2-api --network r2-net --network-alias api \
        -e DB_HOST=r2-db -e DB_NAME=libro -e DB_USER=app \
        -e "DB_PASSWORD=$DB_PASSWORD" \
        "$CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHORT_SHA"
      docker run -d --rm --name r2-web --network r2-net -p 8080:8080 \
        "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHORT_SHA"
      bash scripts/smoke.sh http://docker:8080
