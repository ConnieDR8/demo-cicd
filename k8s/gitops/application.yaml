apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-cicd-r4
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ConnieDR8/demo-cicd.git
    targetRevision: main
    path: k8s/gitops/app
  destination:
    server: https://kubernetes.default.svc
    namespace: demo-gitops
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
