name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  lint:
    name: 1. Lint (ESLint, HTMLHint, Hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: "**/package-lock.json"

      - run: npm ci && npm ci --prefix api
      - run: npm run lint

      - name: Hadolint sobre los tres Dockerfiles
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          recursive: true
          config: .hadolint.yaml
          failure-threshold: warning

  sast:
    name: 2. SAST (Semgrep) y secretos (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Semgrep, análisis estático del código
        run: >
          docker run --rm -v "$PWD:/src:ro" semgrep/semgrep:1.180.0
          semgrep scan --config p/ci --config p/dockerfile --error --metrics=off /src

      - name: Gitleaks, secretos en el historial de Git
        run: >
          docker run --rm -v "$PWD:/repo:ro" --entrypoint sh ghcr.io/gitleaks/gitleaks:v8.30.1
          -c "git config --global --add safe.directory /repo && gitleaks git /repo --redact -v --exit-code 1"
