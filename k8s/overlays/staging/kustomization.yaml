# STAGING: un ambiente persistente, con datos similares a producción, al que solo se llega con aprobación.
# web se expone por NodePort 30080: en Rancher Desktop queda en http://localhost:30080
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demo-staging
resources:
  - ../../base
  - observabilidad/prometheus.yaml
  - observabilidad/grafana.yaml
labels:
  - pairs:
      ambiente: staging
    includeSelectors: false
patches:
  - path: web-nodeport.yaml
  - path: api-replicas.yaml

configMapGenerator:
  - name: prometheus-r3-config
    files:
      - prometheus.yml=observabilidad/prometheus.yml
  - name: grafana-r3-datasource
    files:
      - datasource.yaml=observabilidad/grafana-datasource.yaml
  - name: grafana-r3-provider
    files:
      - provider.yaml=observabilidad/grafana-provider.yaml
  - name: grafana-r3-dashboard
    files:
      - dashboard.json=observabilidad/dashboard.json
