apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-r3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana-r3
  template:
    metadata:
      labels:
        app: grafana-r3
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:11.4.0
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: admin-password
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
          readinessProbe:
            httpGet: {path: /api/health, port: 3000}
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /api/health, port: 3000}
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests: {cpu: 30m, memory: 128Mi}
            limits: {memory: 384Mi}
          volumeMounts:
            - name: datasource
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: provider
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: dashboard
              mountPath: /etc/grafana/dashboards
              readOnly: true
            - name: datos
              mountPath: /var/lib/grafana
      volumes:
        - name: datasource
          configMap:
            name: grafana-r3-datasource
        - name: provider
          configMap:
            name: grafana-r3-provider
        - name: dashboard
          configMap:
            name: grafana-r3-dashboard
        - name: datos
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-r3
spec:
  type: ClusterIP
  selector:
    app: grafana-r3
  ports:
    - port: 3000
      targetPort: 3000
